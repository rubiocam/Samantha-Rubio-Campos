<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Page</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f1f1f1;
      font-family: sans-serif;
      overflow: hidden;
    }

    #book {
      position: relative;
      width: 300px;
      height: 400px;
      perspective: 2000px;
    }

    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      background: white;
      border: 1px solid #ccc;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
      transform-origin: left;
      transition: transform 0.6s ease;
      backface-visibility: hidden;
      overflow: hidden;
      padding: 1rem;
      cursor: grab;
    }

    #page1 { z-index: 3; }
    #page2 { z-index: 2; }
    #page3 { z-index: 1; }

    .page.flipped {
      transform: rotateY(-180deg);
      z-index: 0 !important;
    }

    /* Arrow buttons */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      font-size: 2rem;
      padding: 0.5rem 1rem;
      cursor: pointer;
      border-radius: 50%;
      user-select: none;
    }

    .arrow:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    #prev {
      left: -60px;
    }

    #next {
      right: -60px;
    }
  </style>
</head>
<body>
  <div id="book">
    <div class="page" id="page1">
      <h2>Page 1</h2>
      <p>This is the first page of my scrapbook!</p>
    </div>
    <div class="page" id="page2">
      <h2>Page 2</h2>
      <p>Here’s another spread — add your photos, doodles, or notes here.</p>
    </div>
    <div class="page" id="page3">
      <h2>Page 3</h2>
      <p>You can keep adding more pages like this!</p>
    </div>

    <!-- Navigation arrows -->
    <button class="arrow" id="prev">&#8592;</button>
    <button class="arrow" id="next">&#8594;</button>
  </div>

  <script>
    const pages = Array.from(document.querySelectorAll(".page"));
    let current = 0;

    // Handle arrow buttons
    document.getElementById("next").addEventListener("click", nextPage);
    document.getElementById("prev").addEventListener("click", prevPage);

    function nextPage() {
      if (current < pages.length) {
        pages[current].classList.add("flipped");
        current++;
      }
    }

    function prevPage() {
      if (current > 0) {
        current--;
        pages[current].classList.remove("flipped");
      }
    }

    // --- Drag to flip ---
    let isDragging = false;
    let startX = 0;

    pages.forEach((page, index) => {
      page.addEventListener("mousedown", e => {
        isDragging = true;
        startX = e.clientX;
        page.style.transition = "none"; // disable smooth animation while dragging
      });

      window.addEventListener("mousemove", e => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const rotation = Math.max(Math.min(dx / 3, 0), -180); // clamp between 0 and -180
        page.style.transform = `rotateY(${rotation}deg)`;
      });

      window.addEventListener("mouseup", e => {
        if (!isDragging) return;
        isDragging = false;
        page.style.transition = "transform 0.6s ease";

        const dx = e.clientX - startX;
        if (dx < -80 && index === current) {
          // flipped enough
          nextPage();
        } else {
          // snap back
          page.style.transform = "";
        }
      });
    });
  </script>
</body>
</html>
