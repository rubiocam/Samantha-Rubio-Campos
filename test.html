<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Page</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f1f1f1;
      font-family: sans-serif;
    }

    #book {
      position: relative;
      width: 300px;
      height: 400px;
      perspective: 2000px;
    }

    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      background: white;
      border: 1px solid #ccc;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
      transform-origin: left;
      transition: transform 1s ease, z-index 1s;
      backface-visibility: hidden;
      overflow: hidden;
      padding: 1rem;
    }

    /* Give each page a slightly different offset shadow color */
    #page1 { z-index: 3; }
    #page2 { z-index: 2; }
    #page3 { z-index: 1; }

    .page.flipped {
      transform: rotateY(-180deg);
      z-index: 0 !important;
    }

    .controls {
      position: absolute;
      bottom: -60px;
      width: 100%;
      text-align: center;
    }

    button {
      padding: 8px 16px;
      margin: 0 10px;
      border: none;
      background: #333;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
    }

    button:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div id="book">
    <div class="page" id="page1">
      <h2>Page 1</h2>
      <p>This is the first page of my scrapbook!</p>
    </div>
    <div class="page" id="page2">
      <h2>Page 2</h2>
      <p>Here’s another spread — add your photos, doodles, or notes here.</p>
    </div>
    <div class="page" id="page3">
      <h2>Page 3</h2>
      <p>You can keep adding more pages like this!</p>
    </div>

    <div class="controls">
      <button id="prev">Previous</button>
      <button id="next">Next</button>
    </div>
  </div>

  <script>
    const pages = Array.from(document.querySelectorAll(".page"));
    let current = 0;

    document.getElementById("next").addEventListener("click", () => {
      if (current < pages.length) {
        pages[current].classList.add("flipped");
        current++;
      }
    });

    document.getElementById("prev").addEventListener("click", () => {
      if (current > 0) {
        current--;
        pages[current].classList.remove("flipped");
      }
    });
  </script>
</body>
</html>
